name: Deploy DigiCRM

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.SSH_PRIVATE_KEY_B64 }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "$SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/thinking_healer_deploy
          chmod 600 ~/.ssh/thinking_healer_deploy

          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy DigiCRM
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh \
            -i ~/.ssh/thinking_healer_deploy \
            -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" << 'EOF'

            set -e

            PROJECT_DIR="/home/jupiteermri/public_html/digicrm.celiyo.com/sepratecrm"
            DEPLOY_DIR="/home/jupiteermri/public_html/digicrm.celiyo.com"

            echo "Starting deployment..."

            cd "$PROJECT_DIR"

            echo "Pulling latest code..."
            git pull origin main

            echo "Installing dependencies..."
            npm ci

            echo "Building application..."
            npm run build

            echo "Checking build..."
            test -f dist/index.html
            test -d dist/assets

            echo "Removing old assets..."
            rm -rf "$DEPLOY_DIR/assets"

            echo "Copying new build..."
            cp -a dist/. "$DEPLOY_DIR/"

            echo "Deployment completed successfully"

          EOF
